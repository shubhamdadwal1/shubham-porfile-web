apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-node-app

spec:
  replicas: 3

  selector: 
    matchLabels:
      app: node-app

  template:
    metadata:
      labels:
        app: node-app
        
    spec:
      containers:
        - name: node-cont
          image: shubhamdadwal/shubh-kubernetes:2.0
          ports:
            - containerPort: 3000
      